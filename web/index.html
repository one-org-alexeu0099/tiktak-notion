<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Крестики-нолики</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <p class="eyebrow">Дуэль на девяти клетках</p>
      <h1>Крестики-нолики</h1>
      <p id="status" class="status" aria-live="polite"></p>
    </header>

    <section class="game-panel" aria-label="Игровое поле">
      <section class="scoreboard" aria-labelledby="score-title">
        <div class="scoreboard-heading">
          <h2 id="score-title">Счёт матчей</h2>
          <button id="score-reset" class="score-reset" type="button">Сбросить счёт</button>
        </div>
        <div class="score-grid">
          <div class="score-item score-item--x">
            <span class="score-label">X</span>
            <strong id="score-x">0</strong>
          </div>
          <div class="score-item score-item--o">
            <span class="score-label">O</span>
            <strong id="score-o">0</strong>
          </div>
          <div class="score-item score-item--draw">
            <span class="score-label">Ничьи</span>
            <strong id="score-draws">0</strong>
          </div>
        </div>
      </section>

      <div id="board" class="board" role="grid" aria-label="Поле 3 на 3">
        <button class="cell" type="button" data-index="0" role="gridcell" aria-label="Клетка 1"></button>
        <button class="cell" type="button" data-index="1" role="gridcell" aria-label="Клетка 2"></button>
        <button class="cell" type="button" data-index="2" role="gridcell" aria-label="Клетка 3"></button>
        <button class="cell" type="button" data-index="3" role="gridcell" aria-label="Клетка 4"></button>
        <button class="cell" type="button" data-index="4" role="gridcell" aria-label="Клетка 5"></button>
        <button class="cell" type="button" data-index="5" role="gridcell" aria-label="Клетка 6"></button>
        <button class="cell" type="button" data-index="6" role="gridcell" aria-label="Клетка 7"></button>
        <button class="cell" type="button" data-index="7" role="gridcell" aria-label="Клетка 8"></button>
        <button class="cell" type="button" data-index="8" role="gridcell" aria-label="Клетка 9"></button>
      </div>

      <button id="reset" class="reset-button" type="button">Новая игра</button>
    </section>
  </main>

  <script src="game.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
